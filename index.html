<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mahatma Gandhi University</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mahatma Gandhi University Nalgonda</h1>
        <nav>
            <ul>
                <li><a href="#home">Home1</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#courses">Courses</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section id="home" class="hero">
        <h2>Welcome to Shiva Prasad University</h2>
        <p>Empowering Education for the Future</p>
        <button onclick="showMessage()">Explore More</button>
    </section>

    <section id="about">
        <h2>About Us</h2>
        <p>Shiva University.</p>
    </section>

    <section id="courses">
        <h2>Our Courses</h2>
        <div class="course-container">
            <div class="course">BCA</div>
            <div class="course">MCA</div>
            <div class="course">B.Tech</div>
            <div class="course">MBA</div>
        </div>
    </section>

    <section id="contact">
        <h2>Contact Us</h2>
        <form onsubmit="return submitForm()">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message"></textarea>
            <button type="submit">Send</button>
        </form>
    </section>

    <footer>
        <p>© 2026 Mahatma Gandhi University | All Rights Reserved</p>
    </footer>

<script src="script.js"></script>
</body>
</html>
